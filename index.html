<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Villa Miami × Lacruz Design Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,300;0,400;0,500;1,300;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style id="css-home">
  :root {
    --white: #F6F4EF;
    --bone: #F6F4EF;
    --oat: #ECE5D6;
    --plaster: #E1D9C8;
    --sand: #D2C8B2;
    --ink-3: #877D6A;
    --ink-2: #50483B;
    --ink: #211C15;
    --copper: #A8683D;
    --copper-dim: #C9A583;
    --copper-bright: #C97C43;
    --space-1: 4px; --space-2: 8px; --space-3: 16px; --space-4: 24px;
    --space-5: 32px; --space-6: 48px; --space-7: 64px; --space-8: 96px; --space-9: 144px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { overflow-y: scroll; overflow-x: hidden; }

  body {
    background: var(--bone);
    color: var(--ink);
    font-family: 'Newsreader', serif;
    font-weight: 400;
    font-size: 17px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  em, strong, b { font-style: italic; font-weight: 400; }

  .label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  /* ---------- GATE ---------- */
  #gate {
    display: flex;
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: var(--ink); color: var(--bone);
    align-items: center; justify-content: center;
    z-index: 100;
    transition: opacity 420ms cubic-bezier(0.25,0.1,0.25,1), visibility 420ms;
  }
  #gate.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .gate-box { width: 100%; max-width: 380px; padding: 0 var(--space-5); text-align: center; }
  .gate-lockup { margin-bottom: var(--space-2); }
  .gate-lockup img { height: 51px; width: auto; display: block; margin: 0 auto; }
  .gate-box .label { color: var(--copper-bright); margin-bottom: var(--space-5); display:block; }
  .gate-box input {
    width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--ink-3);
    color: var(--bone); font-family: 'Newsreader', serif; font-size: 22px; padding: var(--space-2) 0;
    text-align: center; outline: none; margin-bottom: var(--space-5);
  }
  .gate-box input:focus { border-bottom-color: var(--copper-bright); }
  .gate-box input::placeholder { color: var(--ink-3); font-style: italic; }
  .gate-btn {
    background: none; border: 1px solid var(--copper-dim); color: var(--bone);
    font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; letter-spacing: 0.16em; text-transform: uppercase;
    padding: 14px 36px; cursor: pointer; transition: background 220ms, color 220ms, border-color 220ms;
  }
  .gate-btn:hover { background: var(--copper); border-color: var(--copper); color: var(--ink); }
  .gate-error { color: #C4785A; font-family: 'IBM Plex Mono', monospace; font-size: 11px; margin-top: var(--space-3); height: 14px; }
  .gate-nda { margin-top: var(--space-6); font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; line-height: 1.7; letter-spacing: 0.02em; color: var(--ink-3); max-width: 300px; margin-left: auto; margin-right: auto; }

  /* ---------- SITE ---------- */
  #site { opacity: 0; transition: opacity 500ms cubic-bezier(0.25,0.1,0.25,1); }
  #site.visible { opacity: 1; }

  header {
    padding: var(--space-4) var(--space-6);
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(244,240,230,0.18);
    position: sticky; top: 0; background: rgba(244,240,230,0.5);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    z-index: 10;
  }
  .lockup-villa img { height: 33px; width: auto; display: block; }
  .lockup-by { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--copper); margin-top: 2px; }
  nav { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-2); }
  nav a {
    color: var(--ink-2); text-decoration: none; font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    letter-spacing: 0.12em; text-transform: uppercase; margin-left: var(--space-5);
    border-bottom: 1px solid transparent; padding-bottom: 2px; transition: border-color 220ms, color 220ms;
  }
  nav a:hover { border-bottom-color: var(--copper); color: var(--copper); }

  .lang-toggle {
    display: flex;
    align-items: center;
    margin-left: var(--space-6);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
  }
  .lang-toggle button {
    background: none; border: none; cursor: pointer;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em;
    color: var(--ink-3); padding: 2px 4px;
  }
  .lang-toggle button.active { color: var(--copper); }
  .lang-toggle .div { color: var(--plaster); margin: 0 2px; }

  .gate-lang { display: flex; justify-content: center; margin-bottom: var(--space-6); }
  .gate-lang button {
    background: none; border: none; cursor: pointer;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em;
    color: var(--ink-3); padding: 2px 6px;
  }
  .gate-lang button.active { color: var(--copper-bright); }
  .gate-lang .div { color: var(--ink-2); }

  /* ---------- HERO · ATOMIC ---------- */
  .hero-atomic {
    background: var(--ink);
    color: var(--bone);
    position: relative;
  }
  .hero-video-block {
    position: relative;
    min-height: 92vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .hero-media { position: absolute; inset: 0; z-index: 0; }
  .hero-media video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero-media .hero-overlay { position: absolute; inset: 0; background: var(--ink); opacity: 0.15; }
  .hero-media .hero-video-placeholder {
    position: absolute; inset: var(--space-6); display: flex; align-items: center; justify-content: center;
    border: 1px dashed var(--ink-2); font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--ink-3); text-align: center; padding: var(--space-5);
  }
  .hero-atomic h1 {
    position: relative; z-index: 1;
    font-weight: 300; font-size: 81px; line-height: 0.98; letter-spacing: -0.02em; max-width: 1200px;
    text-align: left; padding: 0 var(--space-6); margin-right: auto; margin-top: 60px;
  }
  .hero-atomic h1 em { font-style: italic; color: var(--copper-dim); }
  .hero-caption {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--ink-3); text-align: center; padding: 2mm var(--space-6) 0;
  }
  .hero-sub {
    font-size: 17px; color: var(--bone); text-align: center; max-width: 560px; margin: var(--space-4) auto 0; padding: 0 var(--space-6);
  }
  .hero-tickers {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-6);
    max-width: 960px; margin: 0 auto;
    padding: var(--space-5) var(--space-6) var(--space-4);
  }
  .ticker { text-align: center; }
  @media (max-width: 700px) { .hero-tickers { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .ticker .num { font-size: 44px; font-weight: 300; color: var(--copper-bright); line-height: 1; }
  .ticker .cap { display: block; margin-top: var(--space-2); font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); max-width: 160px; margin-left: auto; margin-right: auto; }

  @media (max-width: 900px) {
    .hero-atomic h1 { font-size: 56px; }
  }

  /* ---------- ABOUT STUDIO ---------- */
  .about {
    padding: var(--space-6) var(--space-6);
    display: flex; flex-direction: column;
  }
  .about-top { display: flex; flex-wrap: wrap; margin-bottom: var(--space-6); }
  .about-intro { flex: 1; min-width: 320px; }
  .about-intro .label { margin-bottom: var(--space-3); display: block; }
  .about-copy-row { display: flex; flex-wrap: wrap; align-items: stretch; gap: var(--space-7); }
  .about-copy { flex: 1; min-width: 320px; }
  .about-photo-box { width: 420px; max-width: 45%; flex-shrink: 0; margin-left: auto; position: relative; }
  .wm-mark { position: absolute; inset: 0; background-image: url('assets/wm-logo-trimmed.webp'); background-repeat: no-repeat; background-position: var(--space-3) calc(100% - var(--space-3) - 26px); background-size: 98px auto; opacity: 0.5; pointer-events: none; z-index: 3; }
  .about-intro h2 { font-weight: 300; font-size: 42px; margin-bottom: var(--space-5); letter-spacing: -0.01em; }
  .about-intro p { color: var(--ink-2); font-size: 17px; max-width: 480px; margin-bottom: var(--space-4); }
  .about-intro p:last-child { margin-bottom: 0; }
  .about-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-6); border-top: 1px solid var(--ink-2); padding-top: var(--space-6); }
  .stat2 { text-align: center; margin-bottom: var(--space-5); }
  @media (max-width: 700px) { .about-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .stat2 .num { font-weight: 300; font-size: 46px; color: var(--copper); line-height: 1; }
  .stat2 .label { display: block; margin: var(--space-2) auto 0; max-width: 180px; }

  /* ---------- PULL QUOTE ---------- */
  .pull-quotes-row { padding: var(--space-7) var(--space-6); display: flex; flex-wrap: wrap; gap: var(--space-5); }
  .pull-quotes-label { display: block; margin: 0 var(--space-6) 0; padding-top: var(--space-2); border-top: 1px solid var(--plaster); }
  .pull-quote {
    flex: 1; min-width: 200px;
    max-width: 820px;
  }
  .pull-quote blockquote {
    font-family: 'Newsreader', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 17px;
    line-height: 1.35;
    color: var(--ink);
    margin: 0 0 var(--space-4) 0;
  }
  .pull-quote .attribution { font-family: 'Newsreader', serif; font-style: italic; font-size: 14px; color: var(--ink-3); }

  /* ---------- INSPIRATION · full bleed ink block ---------- */
  .inspiration {
    background: var(--ink);
    color: var(--bone);
    padding: var(--space-6) var(--space-6) var(--space-8);
  }
  .inspiration > .label { display: block; margin-bottom: var(--space-4); color: var(--copper-bright); }
  .inspiration h2 { font-weight: 300; font-size: 52px; margin-bottom: var(--space-7); max-width: 900px; letter-spacing: -0.01em; }
  .inspiration h2 em { font-style: italic; color: var(--copper-dim); }
  .inspiration-cols { display: flex; }
  .inspiration-cols div { flex: 1; margin-right: var(--space-7); }
  .inspiration-cols div:last-child { margin-right: 0; }
  .inspiration-cols p { color: var(--sand); font-size: 17px; }

  @media (max-width: 900px) {
    .inspiration h2 { font-size: 34px; }
    .inspiration-cols { flex-direction: column; }
    .inspiration-cols div { margin-right: 0; margin-bottom: var(--space-5); }
  }

  /* ---------- UNIT COVER · atomic statement per residence ---------- */
  .unit-cover {
    padding: var(--space-8) var(--space-6);
    background: var(--copper);
    color: var(--white);
    position: relative;
  }
  .unit-cover .num-mark {
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.16em;
    text-transform: uppercase; color: rgba(251,248,242,0.7); margin-bottom: var(--space-3); display: block;
  }
  .unit-cover h2 { font-weight: 300; font-size: 72px; line-height: 1; letter-spacing: -0.01em; max-width: 900px; }
  .unit-cover h2 em { font-style: italic; }
  .unit-cover .tagline { margin-top: var(--space-4); font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(251,248,242,0.85); }

  @media (max-width: 900px) {
    .unit-cover h2 { font-size: 40px; }
  }

  .unit {
    padding: var(--space-7) var(--space-6) var(--space-8);
    max-width: 1200px;
  }
  .unit p.meta { color: var(--ink-2); font-size: 16px; max-width: 720px; margin-bottom: var(--space-6); }
  .unit p.moment { font-family: 'Newsreader', serif; font-style: italic; font-weight: 300; color: var(--copper); font-size: 19px; max-width: 640px; margin: -12px 0 var(--space-6) 0; }

  .version-block { margin-bottom: var(--space-8); padding-top: var(--space-7); border-top: 1px solid var(--plaster); }
  .version-block:first-of-type { border-top: none; padding-top: 0; }
  .version-label { font-family: 'Newsreader', serif; font-weight: 300; font-style: italic; font-size: 26px; color: var(--copper); margin-bottom: var(--space-2); }
  .version-sub { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); margin-bottom: var(--space-5); display: block; }

  .plan-strip { margin-bottom: var(--space-6); }
  .plan-strip-label { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--copper); margin-bottom: var(--space-3); }
  .plan-credit { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 0.06em; color: var(--ink-3); margin-top: var(--space-2); }
  .plan-box { background: var(--white); border: 1px solid var(--ink); min-height: 340px; display: flex; align-items: center; justify-content: center; }
  .plan-box .label { color: var(--ink-3); }
  .plan-row { display: flex; }
  .plan-row .plan-box { flex: 1; margin-right: var(--space-3); }
  .plan-row .plan-box:last-child { margin-right: 0; }

  .grand-render {
    position: relative; left: 50%; right: 50%; margin-left: calc(var(--vw100, 100vw) / -2); margin-right: calc(var(--vw100, 100vw) / -2); width: var(--vw100, 100vw);
    min-height: 460px; background: var(--oat); border-top: 1px solid var(--plaster); border-bottom: 1px solid var(--plaster);
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    margin-bottom: var(--space-6); margin-top: var(--space-3);
  }
  .grand-render .label { color: var(--ink-3); }
  .grand-render .cta { display: block; margin-top: var(--space-3); font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--copper); }

  .render-list { display: flex; flex-wrap: wrap; margin-bottom: var(--space-6); }
  .render-list .r-item {
    width: 31.5%; margin-right: 2.75%; margin-bottom: var(--space-3);
    aspect-ratio: 4/3; min-height: 190px; background: var(--oat); border: 1px solid var(--plaster);
    display: flex; align-items: center; justify-content: center; text-align: center; padding: var(--space-2);
  }
  .render-list .r-item:nth-child(3n) { margin-right: 0; }
  .render-list .r-item .label { color: var(--ink-3); }

  .render-grid { display: flex; margin-bottom: var(--space-6); }
  .render-grid .placeholder {
    background: var(--oat); border: 1px solid var(--plaster);
    display: flex; align-items: center; justify-content: center; flex-direction: column;
  }
  .render-grid .placeholder.tall { flex: 1.4; margin-right: var(--space-3); min-height: 520px; }
  .render-grid .placeholder .label { color: var(--ink-3); }
  .render-grid .stack { display: flex; flex-direction: column; flex: 1; }
  .render-grid .stack .placeholder { flex: 1; min-height: 252px; margin-bottom: var(--space-3); }
  .render-grid .stack .placeholder:last-child { margin-bottom: 0; }

  .concept-notes { display: flex; }
  .concept-notes .col { flex: 1; margin-right: var(--space-6); }
  .concept-notes .col:last-child { margin-right: 0; }
  .concept-notes .col .label { margin-bottom: var(--space-3); display: block; color: var(--copper); }
  .concept-notes .col p { color: var(--ink-2); font-size: 16px; margin-bottom: var(--space-3); }
  .concept-notes .col p:last-child { margin-bottom: 0; }

  .callout {
    background: var(--white); border-left: 3px solid var(--copper); padding: var(--space-5);
    margin-top: var(--space-5); font-style: italic; font-size: 18px; color: var(--ink);
  }

  .closing-cta {
    background: var(--ink); color: var(--bone);
    padding: var(--space-8) var(--space-6);
    text-align: center;
  }
  .closing-cta h2 { font-family: 'Newsreader', serif; font-weight: 300; font-size: 40px; margin-bottom: var(--space-4); }
  .closing-cta h2 em { font-style: italic; color: var(--copper-dim); }
  .closing-cta a.cta-link {
    display: inline-block; margin-top: var(--space-3);
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink); background: var(--copper-bright); text-decoration: none;
    padding: 14px 32px; transition: background 220ms;
  }
  .closing-cta a.cta-link:hover { background: var(--bone); }

  footer {
    padding: var(--space-7) var(--space-6); border-top: 1px solid var(--ink);
    display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: var(--space-4);
  }
  footer .label { margin-bottom: var(--space-2); }
  footer .contact { font-size: 15px; }

  @media (max-width: 800px) {
    .unit-head { flex-direction: column; }
    .render-grid { flex-direction: column; }
    .render-list .r-item { width: 47.5%; }
    .render-list .r-item:nth-child(3n) { margin-right: 2.75%; }
    .render-list .r-item:nth-child(2n) { margin-right: 0; }
    .render-grid .placeholder.tall { margin-right: 0; margin-bottom: var(--space-3); }
    .plan-row { flex-direction: column; }
    .plan-row .plan-box { margin-right: 0; margin-bottom: var(--space-3); }
    .plan-row .plan-box:last-child { margin-bottom: 0; }
    .concept-notes { flex-direction: column; }
    .concept-notes .col { margin-right: 0; margin-bottom: var(--space-5); }
    nav a { margin-left: var(--space-3); }
    .about-intro { margin-right: 0; }
  }

  .grand-render.has-img { min-height: 0; background: var(--ink); display: block; border: none; }
  .grand-render.has-img img { display: block; width: 100%; height: auto; max-height: 86vh; object-fit: cover; cursor: pointer; }
  .piano-gallery figure { margin: 0; position: relative; }
  .render-cap { position: absolute; left: var(--space-3); bottom: var(--space-3); font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--bone); margin-top: 0; z-index: 1; }
  .piano-gallery {
    position: relative; left: 50%; right: 50%; margin-left: calc(var(--vw100, 100vw) / -2); margin-right: calc(var(--vw100, 100vw) / -2); width: var(--vw100, 100vw);
    display: grid; grid-template-columns: 1fr 1fr; column-gap: 5mm; row-gap: 5mm; margin-bottom: var(--space-3);
  }
  .piano-gallery img { display: block; width: 100%; height: auto; object-fit: cover; cursor: pointer; }
  .piano-gallery .g-dining, .piano-gallery .g-bookshelf, .piano-gallery .g-foyer { grid-column: 1 / -1; }
  .piano-gallery .g-dining img { aspect-ratio: 16/8; }
  .piano-gallery .g-bookshelf img, .piano-gallery .g-foyer img { aspect-ratio: 16/9; }
  .piano-gallery .g-living img, .piano-gallery .g-bed img { aspect-ratio: 4/3; }
  .gallery-cta { display: block; margin: var(--space-4) 0 var(--space-6); font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--copper); }
  @media (max-width: 760px) { .piano-gallery { grid-template-columns: 1fr; } .piano-gallery .g-dining img { aspect-ratio: 4/3; } }

  /* ---------- LIGHTBOX ---------- */
  .lightbox { position: fixed; inset: 0; background: rgba(23,20,16,0.94); z-index: 1000; display: none; align-items: center; justify-content: center; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 88vw; max-height: 84vh; object-fit: contain; display: block; }
  .lightbox .wm-mark { background-size: 68px auto; background-position: var(--space-4) calc(100% - var(--space-4) - 18px); }
  .lightbox-close { position: absolute; top: var(--space-5); right: var(--space-6); background: none; border: none; color: var(--bone); font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; }
  .lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--bone); font-size: 36px; font-weight: 300; cursor: pointer; padding: var(--space-4); line-height: 1; }
  .lightbox-prev { left: var(--space-4); }
  .lightbox-next { right: var(--space-4); }
  .lightbox-count { position: absolute; bottom: var(--space-5); left: 50%; transform: translateX(-50%); color: var(--ink-3); font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em; }

  .preview-notes { padding: var(--space-8) var(--space-6) var(--space-7); max-width: 1200px; border-bottom: 1px solid var(--plaster); }
  .preview-notes > .label { display: block; margin-bottom: var(--space-5); }
  .preview-notes .cols { display: flex; }
  .preview-notes .col { flex: 1; margin-right: var(--space-6); }
  .preview-notes .col:last-child { margin-right: 0; }
  .preview-notes .col h3 { font-family: 'Newsreader', serif; font-weight: 400; font-size: 22px; margin-bottom: var(--space-2); }
